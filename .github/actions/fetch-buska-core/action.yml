name: "Fetch buska-core"
description: >
  Downloads a buska-core release wheel into ./vendor. The single copy of
  this logic — consumer repos reference it instead of each keeping their
  own copy of the gh release download call.
inputs:
  version:
    description: >
      buska-core release tag to fetch, e.g. v0.1.0. Leave unset to read the
      caller repo's ./.buska-core-version file instead — the recommended
      way, so there's one file per consumer to bump rather than a value
      duplicated into workflow YAML too.
    required: false
    default: ""
  token:
    description: >
      Pre-minted GitHub token with read access to BusKa-org/buska-core.
      Prefer app-client-id/app-private-key below instead — a raw token
      here is almost always a personal PAT, which ties CI's access to
      whoever created it and breaks if they leave or their account is
      suspended. This exists for local/manual use, not for consumer CI
      secrets.
    required: false
    default: ""
  app-client-id:
    description: >
      Client ID of a GitHub App installed on BusKa-org/buska-core with
      Contents: Read-only. An org-owned identity instead of a person's —
      the recommended way to authenticate this from consumer CI.
    required: false
    default: ""
  app-private-key:
    description: "Private key (PEM) of the GitHub App given in app-client-id."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Mint installation token from GitHub App
      if: inputs.app-client-id != ''
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: BusKa-org
        repositories: buska-core

    - shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || steps.app-token.outputs.token }}
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        if [ -z "$GH_TOKEN" ]; then
          echo "::error::Provide either 'token' or 'app-client-id'+'app-private-key'." >&2
          exit 1
        fi
        VERSION="$VERSION_INPUT"
        if [ -z "$VERSION" ]; then
          VERSION="$(cat .buska-core-version)"
        fi
        mkdir -p vendor
        gh release download "$VERSION" \
          --repo BusKa-org/buska-core \
          --pattern "*.whl" \
          --dir vendor \
          --clobber
