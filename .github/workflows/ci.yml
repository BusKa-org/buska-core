name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: buska-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check buska_core tests

      - name: Format check (black)
        run: uv run black --check buska_core tests

      - name: Type check (mypy)
        run: uv run mypy buska_core

      - name: Test
        run: uv run pytest -q
